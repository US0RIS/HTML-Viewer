<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>us0ris.github.io</title>
<style>
  body {
    margin: 0;
    background: #0a0a0a;
    font-family: system-ui, sans-serif;
    color: white;
  }
  header {
    padding: 20px;
    font-size: 32px;
    font-weight: 700;
    text-align: center;
    border-bottom: 1px solid #333;
  }
  #projects {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
    padding: 30px;
  }
  .card {
    background: #111;
    padding: 20px;
    border-radius: 12px;
    border: 1px solid #333;
    cursor: pointer;
    transition: 0.15s;
  }
  .card:hover {
    transform: translateY(-5px);
    border-color: #666;
  }
  .title {
    font-size: 22px;
    margin-bottom: 6px;
  }
  .desc {
    font-size: 14px;
    opacity: 0.8;
  }
</style>
</head>

<body>
<header>us0ris.github.io</header>

<div id="projects">
  <div class="card" onclick="location='games/cylindrix.html'">
    <div class="title">Cylindrix</div>
    <div class="desc">3D Tetris on a cylinder.</div>
  </div>
</div>

</body>
</html>
